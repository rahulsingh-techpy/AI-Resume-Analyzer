<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — AI Resume Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-aurora"><span class="orb-1"></span><span class="orb-2"></span><span class="orb-3"></span></div>

<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar d-none d-lg-block" style="width:260px; position:sticky; top:0;">
    <a class="navbar-brand-custom mb-4 d-block" href="/"><span class="logo-dot"></span>ResumeAI</a>
    <nav class="nav flex-column">
      <a class="nav-link active" href="#overview" onclick="showSection('overview')"><i class="fa-solid fa-gauge-high"></i> Overview</a>
      <a class="nav-link" href="#applicants" onclick="showSection('applicants')"><i class="fa-solid fa-users"></i> Applicants</a>
      <a class="nav-link" href="#analytics" onclick="showSection('analytics')"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
      <a class="nav-link" href="/"><i class="fa-solid fa-house"></i> Back to Site</a>
    </nav>
  </div>

  <!-- Main -->
  <div class="flex-grow-1">
    <nav class="navbar navbar-glass">
      <div class="container-fluid px-4">
        <h5 class="mb-0">Admin Dashboard</h5>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted-custom small d-none d-md-inline">{{ user.name if user else '' }}</span>
          <button class="btn btn-glass-outline btn-sm" id="exportCsvBtn"><i class="fa-solid fa-file-export me-2"></i>Export CSV</button>
          <a href="{{ url_for('logout') }}" class="btn btn-glass-outline btn-sm"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-4 py-4">

      <!-- Overview -->
      <div id="overviewSection" class="admin-section">
        <div class="row g-4 mb-4">
          <div class="col-md-3 col-6">
            <div class="glass-card glass-card-static p-4 text-center">
              <div class="stat-number" id="statTotal">0</div>
              <div class="stat-label">Total Applicants</div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="glass-card glass-card-static p-4 text-center">
              <div class="stat-number" id="statAvgScore">0%</div>
              <div class="stat-label">Avg Resume Score</div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="glass-card glass-card-static p-4 text-center">
              <div class="stat-number" id="statTopRole">—</div>
              <div class="stat-label">Most Common Role</div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="glass-card glass-card-static p-4 text-center">
              <div class="stat-number" id="statTopSkill">—</div>
              <div class="stat-label">#1 Skill</div>
            </div>
          </div>
        </div>
        <div class="row g-4">
          <div class="col-lg-6"><div class="glass-card glass-card-static p-3" id="chartScoreDist" style="min-height:340px;"></div></div>
          <div class="col-lg-6"><div class="glass-card glass-card-static p-3" id="chartRoleDist" style="min-height:340px;"></div></div>
        </div>
      </div>

      <!-- Applicants -->
      <div id="applicantsSection" class="admin-section d-none">
        <div class="glass-card glass-card-static p-4">
          <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-3">
            <h5 class="mb-0">All Applicants</h5>
            <div class="d-flex gap-2 flex-wrap">
              <input type="text" class="form-control form-control-glass" id="searchInput" placeholder="Search by name or email..." style="width:240px;">
              <select class="form-select form-select-glass" id="roleFilter" style="width:200px;">
                <option value="">All Roles</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-glass mb-0">
              <thead>
                <tr><th>Name</th><th>Email</th><th>Score</th><th>Top Role</th><th>Uploaded</th><th></th></tr>
              </thead>
              <tbody id="applicantsTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Analytics -->
      <div id="analyticsSection" class="admin-section d-none">
        <div class="row g-4">
          <div class="col-lg-6"><div class="glass-card glass-card-static p-3" id="chartTopSkills" style="min-height:380px;"></div></div>
          <div class="col-lg-6"><div class="glass-card glass-card-static p-3" id="chartEducation" style="min-height:380px;"></div></div>
          <div class="col-lg-6"><div class="glass-card glass-card-static p-3" id="chartExperience" style="min-height:380px;"></div></div>
          <div class="col-lg-6"><div class="glass-card glass-card-static p-3" id="chartMonthly" style="min-height:380px;"></div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Applicant detail modal -->
<div class="modal fade" id="applicantModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content" style="background: var(--bg-elevated); border: 1px solid var(--glass-border); color: var(--text-primary);">
      <div class="modal-header" style="border-color: var(--glass-border);">
        <h5 class="modal-title">Applicant Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="applicantModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
