<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — AI Resume Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-aurora"><span class="orb-1"></span><span class="orb-2"></span><span class="orb-3"></span></div>

<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="col-11 col-sm-8 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <a class="navbar-brand-custom justify-content-center" href="/"><span class="logo-dot"></span>ResumeAI</a>
    </div>

    <div class="glass-card glass-card-static p-4 p-md-5">
      <h3 class="mb-1">Welcome back</h3>
      <p class="text-muted-custom mb-4">Log in to view your resume analysis history.</p>

      {% if error %}
      <div class="alert mb-3" style="background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.4); color: var(--danger); border-radius: var(--radius-sm);">
        <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <div class="mb-3">
          <label class="form-label small text-muted-custom">Email Address</label>
          <input type="email" name="email" class="form-control form-control-glass" value="{{ email or '' }}" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label small text-muted-custom">Password</label>
          <input type="password" name="password" class="form-control form-control-glass" required>
        </div>
        <button type="submit" class="btn btn-gradient w-100">Log In</button>
      </form>

      <p class="text-center text-muted-custom small mt-4 mb-0">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-gradient text-decoration-none fw-semibold">Sign up</a>
      </p>
      <p class="text-center text-muted-custom small mt-2 mb-0">
        Admin demo login: <code>admin@resumeai.com</code> / <code>admin123</code>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
